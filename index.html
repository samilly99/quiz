<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Programação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz">

        <h1> ✨​ Quiz do Milhão ✨</h1>

        <div class="topo">
            <span id="numero-pergunta">Pergunta 1</span>
            <span id="premio">💰 R$ 0</span>
        </div>

        <div class="barra">
            <div id="progresso"></div>
        </div>

        <div id="materia" class="materia">
            📚 Matéria
        </div>

        <h2 id="pergunta">
            Pergunta
        </h2>

        <div id="alternativas">
            <!-- As alternativas serão geradas pelo JavaScript -->
        </div>

        <div id="mensagem"></div>

        <!-- Botões especiais -->
        <div class="controles-especiais">
            <button id="parar">🛑 Parar</button>
            <button id="eliminar">✂️ Eliminar 2 (30%)</button>
            <button id="risco">🔥 Arriscar (Dobrar)</button>
            <button id="reiniciar">🔄 Reiniciar</button>
        </div>

        <button id="proxima">
            Próxima Pergunta
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
